name: Automated API Tests Executions (Newman)

# Se ejecuta automáticamente en cada 'push' a la rama main o de forma manual
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga el código de tu repositorio
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configura Node.js en la máquina virtual de GitHub
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 3. Instala Newman y el generador de reportes htmlextra
      - name: Install Newman & HTML Extra Reporter
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      # 4. Ejecuta las pruebas de Postman
      - name: Run Postman Tests
        run: |
          newman run "E-Commerce_API-QA_Portfolio.postman_collection.json" -e "E-Commerce_QA_Env.postman_environment.json" -r cli,htmlextra --reporter-htmlextra-export reports/reporte_ci.html

      # 5. Guarda el reporte generado como un artefacto descargable en GitHub
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-html-report
          path: reports/reporte_ci.html