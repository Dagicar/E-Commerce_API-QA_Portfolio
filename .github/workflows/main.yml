name: Automated API Tests Executions (Newman)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman & HTML Extra Reporter
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Create Reports Directory
        run: mkdir -p reports

      - name: Run Postman Tests
        run: |
          newman run "E-Commerce_API-QA_Portfolio.postman_collection.json" -e "E-Commerce_QA_Env.postman_environment.json" -r cli,htmlextra --reporter-htmlextra-export reports/reporte_ci.html --suppress-exit-code

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-html-report
          path: reports/reporte_ci.html